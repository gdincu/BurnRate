<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="BurnRate — check the fuel consumption you must hold to reach your destination.">
    <meta name="theme-color" content="#0d6efd">
    <title>BurnRate</title>
    <link rel="manifest" href="./manifest.json">
    <link rel="icon" type="image/svg+xml" href="./icons/icon.svg">
    <link rel="icon" type="image/png" sizes="32x32" href="./icons/favicon-32.png">
    <link rel="icon" type="image/png" sizes="16x16" href="./icons/favicon-16.png">
    <link rel="apple-touch-icon" href="./icons/apple-touch-icon.png">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="./css/style.css">
</head>
<body class="bg-light">

<div class="container mt-5">
    <div class="row justify-content-center">
        <div class="col-md-6 col-lg-5">
            <div class="card shadow-sm border-0">
                <div class="card-header bg-primary text-white text-center py-3">
                    <h4 class="mb-0">BurnRate</h4>
                </div>
                <div class="card-body p-4">
                    <p class="text-muted small">Assumes you started this trip with a full tank.</p>
                    <form id="fuelForm">
                        <div class="mb-3">
                            <label for="tankCapacity" class="form-label fw-bold">Fuel Tank Capacity (Liters)</label>
                            <input type="number" class="form-control" id="tankCapacity" value="47" required min="0.1" step="any" inputmode="decimal">
                        </div>

                        <div class="mb-3">
                            <label for="totalKm" class="form-label fw-bold">Total Distance (km)</label>
                            <input type="number" class="form-control" id="totalKm" required min="0.1" step="any" inputmode="decimal" placeholder="e.g. 600">
                        </div>

                        <div class="mb-3">
                            <label for="coveredKm" class="form-label fw-bold">Covered So Far (km)</label>
                            <input type="number" class="form-control" id="coveredKm" required min="0" step="any" inputmode="decimal" placeholder="e.g. 150">
                        </div>

                        <div class="mb-4">
                            <label for="fuelPercent" class="form-label fw-bold">Current Fuel Level (%)</label>
                            <div class="input-group">
                                <input type="number" class="form-control" id="fuelPercent" required min="0" max="100" step="any" inputmode="decimal" placeholder="e.g. 70">
                                <span class="input-group-text">%</span>
                            </div>
                        </div>

                        <button type="submit" class="btn btn-primary w-100 py-2 fs-5">Calculate</button>
                    </form>

                    <div id="resultBox" class="alert mt-4 d-none text-center" role="alert">
                        <span id="resultText"></span>
                    </div>
                    <noscript>
                        <div class="alert alert-warning mt-3 text-center">BurnRate needs JavaScript to calculate fuel figures.</div>
                    </noscript>
                </div>
            </div>
        </div>
    </div>
</div>

<script src="./js/script.js"></script>
</body>
</html>
