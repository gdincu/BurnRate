<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fuel Consumption Calculator</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body class="bg-light">

<div class="container mt-5">
    <div class="row justify-content-center">
        <div class="col-md-6 col-lg-5">
            <div class="card shadow-sm border-0">
                <div class="card-header bg-primary text-white text-center py-3">
                    <h4 class="mb-0">Fuel Target Calculator</h4>
                </div>
                <div class="card-body p-4">
                    <form id="fuelForm">
                        <div class="mb-3">
                            <label for="tankCapacity" class="form-label fw-bold">Fuel Tank Capacity (Liters)</label>
                            <input type="number" class="form-control" id="tankCapacity" value="47" required min="1">
                        </div>

                        <div class="mb-3">
                            <label for="totalKm" class="form-label fw-bold">Total Distance (km)</label>
                            <input type="number" class="form-control" id="totalKm" required min="1">
                        </div>

                        <div class="mb-3">
                            <label for="coveredKm" class="form-label fw-bold">Covered So Far (km)</label>
                            <input type="number" class="form-control" id="coveredKm" required min="0">
                        </div>

                        <div class="mb-4">
                            <label for="fuelPercent" class="form-label fw-bold">Current Fuel Level (%)</label>
                            <div class="input-group">
                                <input type="number" class="form-control" id="fuelPercent" required min="0" max="100">
                                <span class="input-group-text">%</span>
                            </div>
                        </div>

                        <button type="submit" class="btn btn-primary w-100 py-2 fs-5">Calculate</button>
                    </form>

                    <div id="resultBox" class="alert mt-4 d-none text-center" role="alert">
                        <span id="resultText"></span>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

<script src="script.js"></script>
</body>
</html>
